<div class="ov" id="menu"><h1>POHANTOON TA</h1><p class="tag">Education is every girl's right.</p><p>Run to school! ← → change lane · ↑ / Space jump · ↓ slide<br>Mobile: swipe. Jump low obstacles, slide under beams, dodge people & carts.</p><button id="play">PLAY</button></div>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,cx,hy,by,K,R;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);cx=W/2;hy=H*.36;by=H*.84;K=Math.min(H*.2,W*.4);R=Math.min(W*.5,H*.9)}

/* ---------- state ---------- */
let st='menu',T=0,tt=0,dist,sp,score,coins,gap,pl,obs,cns,fx,msgs,shake,nextS,hitT,dg,dgT,dodged,deadT,gx,stepT,dustT,best=ST.get('pt_best',0),bank=ST.get('pt_coins',0);
const MSG=['Education is a right!','Keep learning!','Knowledge is power!','Every girl deserves education!','Dream big!','Never stop learning!'],LINES=['Stop!','Come back!','Where are you going?','Get inside!','You cannot go!'];

function spawn(z=54,f0){const d=Math.min(1,T/90),f=f0===undefined?Math.floor(Math.random()*3)-1:f0,pick=a=>a[Math.random()*a.length|0];
 for(const l of[-1,0,1]){if(l===f)continue;if(Math.random()>.78+d*.2)continue;const r=Math.random();let t=r<.4?pick(['barrier','bricks','mud','puddle']):r<.62?'beam':r<.82?'cart':pick(['npc0','npc1','npcm','npcm']);
  obs.push({t,l,z,v:t==='npcm'?(Math.random()<.5?-1:1)*(.6+d*1.4):0,done:0,var:Math.random()})}

function upd(dt){T+=dt;const d=T/120;sp=Math.min(40,17+T*.27)*(hitT>0?.6:1);dist+=sp*dt;score+=sp*dt*.5;hitT-=dt;pl.hit-=dt;shake=Math.max(0,shake-dt);pl.sl-=dt;pl.sq-=dt;

 else{stepT-=dt;if(stepT<=0){SFX.step();stepT=.28*15/sp}dustT-=dt;if(dustT<=0){dust(X(pl.x,0)+(Math.random()-.5)*20,by,1);dustT=.08}}

 obs=obs.filter(o=>o.z>-4&&o.done!==2||o.done===2&&o.z>-4&&0);cns=cns.filter(c=>c.z>-3&&!c.got);

function dead(dt){deadT+=dt;for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}if(deadT>2.2&&over.classList.contains('h')){res.textContent=`Score ${score|0} · Coins ${coins} · Distance ${dist|0} m · Best ${best}`;over.classList.remove('h')}}
/* ---------- hidden chase + Gulkhan voice (not rendered during play) ---------- */
const VOICE={files:{/* add voice files later, e.g. 'STOP!':'audio/stop.mp3' */},cfg:{volMin:.25,volMax:1}};let vAud=null;
function voiceBusy(){return(window.speechSynthesis&&speechSynthesis.speaking)||(vAud&&!vAud.ended&&!vAud.paused)}
function shout(t,near,force){if(!snd||(!force&&voiceBusy()))return;say(t);const vol=VOICE.cfg.volMin+(VOICE.cfg.volMax-VOICE.cfg.volMin)*near;

 const f=VOICE.files[t];if(f){try{vAud=new Audio(f);vAud.volume=vol;vAud.play().catch(()=>{});return}catch(e){}}
 if(window.speechSynthesis){try{const u=new SpeechSynthesisUtterance(t.toLowerCase());u.volume=vol;u.pitch=.3+.3*(1-near);u.rate=.95+.35*near;if(force)speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
function chase(dt){const near=1-Math.max(0,Math.min(1,gap));cdist+=dt;if(cdist>.3){cdist=0;noise(.05,.02+.1*near,250)}

/* ---------- input ---------- */
function act(a){if(st!=='play')return;if(a==='L')pl.l=Math.max(-1,pl.l-1);if(a==='R')pl.l=Math.min(1,pl.l+1);

 if(a==='D'){if(pl.air)pl.vy=-22;else if(pl.sl<=0){pl.sl=.7;SFX.slide();dust(X(pl.x,0),by,8)}}}
addEventListener('keydown',e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',' ':'U'}[e.key];if(m){e.preventDefault();act(m)}});
let tx,ty,tdone;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;tdone=0},{passive:true});

/* ---------- drawing: characters ---------- */
function limb(x1,y1,x2,y2,w,c){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}

 for(const i of[-1,1]){const a=idle?0:Math.sin(ph+(i>0?0:Math.PI))*8,ex=i*19+a*.3,ey=air?-66:-54;limb(i*14,-80,ex,ey,7,'#1e8a78');g.fillStyle='#e0ac80';g.beginPath();g.arc(ex,ey,3.5,0,7);g.fill()}

 g.fillStyle='#f5f0e6';g.beginPath();g.moveTo(-7,-88);g.lineTo(sw*7+(idle?0:3),-70);g.lineTo(7,-88);g.fill();g.restore()}
function gul(x,y,sc,ph,m){g.save();g.translate(x,y);g.scale(sc,sc);g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,0,28,7,0,0,7);g.fill();

 g.fillStyle='#b99a63';g.beginPath();g.ellipse(0,-106,15,10,0,0,7);g.fill();g.fillStyle='#a58a5a';g.fillRect(-15,-104,30,6);g.restore()}
